# EPIC-AMP protein–peptide docking benchmark — frozen target list
#
# Source: "AMP data edited.xlsx". Single source of truth for which complexes are
# benchmarked and how each DockQ reference is built.
#
# Fields per target:
#   receptor_chains / peptide_chains   chain IDs in the deposited entry
#   peptide_length                     residue count from the source spreadsheet
#   peptide_length_source              provenance of peptide_length
#   peptide_resolved                   residues of the peptide actually modelled
#                                      in the crystal / SEQRES length (from
#                                      pipeline/prep_native.py -> data/natives/_audit.csv)
#   pep_nonstd                         non-standard / D-amino-acid residues found in
#                                      the peptide chain (empty if none) -- a
#                                      sequence-only structure predictor cannot
#                                      represent these
#   topology                           linear | cyclic | unknown
#   native_source                      assembly1 (biological assembly) unless noted.
#                                      pipeline default reads the deposited entry;
#                                      pass --source assembly only where notes say so.
#   native_chains                      one receptor + one peptide kept in the reference
#   tier                               processing order: 1 simple 1:1 short,
#                                      2 1:1 medium/long, 3 multi-chain
#   quality                            ok      >= 80% of the peptide resolved, all
#                                              standard L-amino acids
#                                      caution 50-80% resolved but otherwise clean —
#                                              interface may be partial; report with
#                                              an asterisk
#                                      drop    unusable: peptide mostly disordered,
#                                              OR contains D-amino-acid / non-standard
#                                              / unencodable residues
#   include                            true = part of the scored benchmark. Dropped
#                                      targets are kept here (include: false) for
#                                      provenance -- never delete a row, only flag it.
#
# Score with:  DockQ <model> <native> --mapping <rec><pep>:<rec><pep>
# (pipeline/run_dockq.py does this). Standard DockQ thresholds; --capri_peptide is
# available but the DockQ authors flag it as unreliable.
#
# 6 included (3 ok, 3 caution), 12 dropped (6 peptide-disordered, 6 D-amino-acid /
# non-standard-residue -- see DROPPED section for exact reasons per target).

