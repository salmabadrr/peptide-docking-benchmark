# EPIC-AMP protein–peptide docking benchmark — frozen target list (18 complexes)
#
# Source: "AMP data edited.xlsx". This file is the single source of truth for
# which complexes are benchmarked and how their native reference is built.
#
# Fields per target:
#   receptor_chains        chain IDs in the deposited entry that form the receptor
#   peptide_chains         chain IDs of the peptide ligand(s)
#   peptide_length         residue count (longest peptide copy)
#   peptide_length_source  provenance of peptide_length
#   topology               linear | cyclic | unknown  (affects tool validity)
#   native_source          how the DockQ reference is produced (see NATIVE REFERENCE)
#   native_chains          chains kept in the reduced native (receptor + one peptide)
#   tier                   processing order: 1 simple 1:1 short, 2 1:1 medium/long,
#                          3 multi-chain, 4 edge case (report separately)
#   include                true = counts toward headline numbers
#   report_separately      true = run it, but keep it out of aggregate stats
#   notes
#
# NATIVE REFERENCE
#   Use first biological assembly:  https://files.rcsb.org/download/<ID>.pdb1
#   Reduce to ONE receptor unit + ONE bound peptide (native_chains).
#   Score with:  DockQ <model> <native> --capri_peptide  [--mapping M:N]
#   Rationale: assembly1 is the curated functional form; keeps continuity with
#   the earlier AlphaFold-Multimer/DockQ runs (Ali) which used .pdb1.
#   For simple 1:1 entries assembly1 == asymmetric unit, so the choice is moot.

6HY2:
  receptor_chains: [X]
  peptide_chains: [A]
  peptide_length: 12
  peptide_length_source: user_supplied
  topology: linear
  native_source: assembly1
  native_chains: {receptor: [X], peptide: [A]}
  tier: 1
  include: true
  report_separately: false
  notes: "Phase-1 pilot. DiffPepBuilder preprocess_utils CA-atom patch applied for this entry."

