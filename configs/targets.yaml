# ================================================================ DROPPED
# Kept for provenance. Never delete a row -- flag it. Two disqualifying reasons:
#
# (A) PEPTIDE MOSTLY DISORDERED -- < 50% of the peptide resolved in the crystal,
#     so there is no reliable native interface to score against.
#
# (B) D-AMINO-ACID / NON-STANDARD PEPTIDE -- the peptide chain contains D-residues
#     (D-Ala, D-Leu, ... -- a mirror-image chemistry) and/or non-proteinogenic
#     residues with no one-letter code (written as 'X' in the sequence). Every
#     structure predictor here (AlphaFold-Multimer, AlphaFold 3, Boltz-2, Chai-1,
#     Protenix, DiffPepDock) is trained only on L-amino-acid structures and takes a
#     plain letter sequence -- it always builds the L-enantiomer. Comparing that to
#     a D-peptide native via DockQ measures an L-vs-D mirror mismatch, not the
#     predictor's skill: every method would score near 0, identically, which adds
#     no discriminating information and (for an all-D chain) can crash DockQ
#     outright (Bio.PDB drops non-standard residues -> KeyError on the chain).

